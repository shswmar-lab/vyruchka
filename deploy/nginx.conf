# Конфигурация nginx для «Выручка водителей»
# Скрипт deploy.sh установит его как /etc/nginx/sites-available/vyruchka
# Замените server_name на реальный адрес сервера (или оставьте _).

server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        # Статику можно отдавать напрямую nginx'ом (быстрее)
        alias /opt/vyruchka/static/;
        expires 1d;
        add_header Cache-Control "public";
    }
}

